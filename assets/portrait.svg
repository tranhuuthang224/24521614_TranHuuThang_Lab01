<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Portrait of Tran Huu Thang">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="80" cy="80" r="76" />
    </clipPath>
  </defs>

  <!-- Background Circle -->
  <circle cx="80" cy="80" r="78" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="3" />

  <g clip-path="url(#circleClip)">
    <!-- Clothing / Body -->
    <path d="M28 160 C32 125, 52 110, 80 110 C108 110, 128 125, 132 160 Z" fill="#0f172a" />
    <path d="M62 110 L80 132 L98 110 Z" fill="#1e293b" />
    <!-- Collar / Shirt -->
    <path d="M68 110 L80 126 L92 110 Z" fill="#ffffff" opacity="0.9" />

    <!-- Neck -->
    <rect x="71" y="92" width="18" height="24" rx="4" fill="url(#skinGrad)" />

    <!-- Head / Face -->
    <ellipse cx="80" cy="74" rx="28" ry="32" fill="url(#skinGrad)" />

    <!-- Hair -->
    <path d="M52 68 C50 42, 65 34, 80 34 C98 34, 110 42, 108 68 C102 54, 92 48, 80 48 C68 48, 58 54, 52 68 Z" fill="url(#hairGrad)" />

    <!-- Eyebrows -->
    <path d="M62 60 Q69 58 74 61" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M86 61 Q91 58 98 60" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Glasses Frame -->
    <rect x="58" y="64" width="18" height="13" rx="3" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <rect x="84" y="64" width="18" height="13" rx="3" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <line x1="76" y1="70" x2="84" y2="70" stroke="#0f172a" stroke-width="2.5" />

    <!-- Eyes (behind glasses) -->
    <circle cx="67" cy="70" r="2.5" fill="#0f172a" />
    <circle cx="93" cy="70" r="2.5" fill="#0f172a" />

    <!-- Nose -->
    <path d="M79 74 L78 82 L82 82" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Smile -->
    <path d="M72 88 Q80 95 88 88" stroke="#9a3412" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>
</svg>
